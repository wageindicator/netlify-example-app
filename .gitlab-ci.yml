# Publish main to the existing Netlify site.
# Netlify's Git connection clones GitHub, GitLab.com, and Bitbucket only.
# This repository is on git.pythonunited.com, so CI uploads the site.
# NETLIFY_AUTH_TOKEN is a masked CI/CD variable.

stages:
  - deploy

deploy_production:
  stage: deploy
  image: node:22-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    NETLIFY_SITE_ID: c1e390f3-c4ab-4836-9906-c5ed88ab080f
  script:
    - npm install --global netlify-cli@27.16.2
    - netlify deploy --prod --no-build --dir=. --functions=netlify/functions --site="$NETLIFY_SITE_ID" --message="$CI_COMMIT_TITLE"
